stages:
  - build
  - package
build_job:
    stage: build
    image: oven/bun:1-alpine
    before_script:
      - cd screentimer
    script:
      - bun install --frozen-lockfile
      - bun run build

package_job:
    stage: package
    image: docker:24-dind
    services:
      - docker:24-dind
    variables:
      DOCKER_TLS_CERTDIR: "/certs"
    before_script:
      - docker login "$ACR_LOGIN_SERVER" -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET"
    script:
      - cd screentimer
      - docker build -t "$ACR_LOGIN_SERVER/screentimer:latest" .
      - docker push "$ACR_LOGIN_SERVER/screentimer:latest"
    rules:
      - if: '$CI_COMMIT_BRANCH == "react-prototype"'