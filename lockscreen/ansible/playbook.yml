---
- name: Installer les dépendances du lockscreen
  hosts: local
  become: true
  vars:
    projet_dir: "{{ playbook_dir }}/.."
    paquets:
      - python3
      - python3-xlib
      - xsecurelock
      - xdotool
      - coreutils

  tasks:
    - name: Vérifier que la session est X11
      ansible.builtin.fail:
        msg: "Session '{{ lookup('env', 'XDG_SESSION_TYPE') }}' non supportée, utiliser X11."
      when: lookup('env', 'XDG_SESSION_TYPE') != 'x11'

    - name: Vérifier la présence d'une session graphique (DISPLAY)
      ansible.builtin.fail:
        msg: "DISPLAY non défini, aucune session graphique X11 détectée."
      when: lookup('env', 'DISPLAY') == ''

    - name: Mettre à jour le cache apt
      ansible.builtin.apt:
        update_cache: true

    - name: Installer les dépendances
      ansible.builtin.apt:
        name: "{{ paquets }}"
        state: present

    - name: Vérifier le module Python Xlib (+ extension shape)
      become: false
      ansible.builtin.command: python3 -c "import Xlib; from Xlib.ext import shape"
      changed_when: false

    - name: Rendre les scripts exécutables
      become: false
      ansible.builtin.file:
        path: "{{ projet_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - lock.sh
        - saver.sh
        - transparent_saver.py