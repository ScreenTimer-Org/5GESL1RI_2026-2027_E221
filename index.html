<!DOCTYPE html>
<html lang="fr">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Examen - Gestion de présence</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header>
        <h1>Gestion de présence - Examen</h1>
    </header>

    <main>

        <section id="bloc-matricule" class="bloc">
            <h2>Matricule</h2>

            <form id="form-matricule">
                <label for="cours">Cours de l’examen :</label>
                <input type="text" id="cours" name="cours" placeholder="Exemple : 5ASR1R" value="" required>
                <p> </p>
                <label for="matricule">Matricule de l’étudiant :</label>

                <input type="text" id="matricule" name="matricule" placeholder="Exemple : 65717 " inputmode="numeric">
                <button type="submit">Valider</button>

            </form>
        </section>

        <section id="bloc-statut" class="bloc">
            <h2>Statut</h2>
            <p id="statut-etudiant">En attente de vérification.</p>
        </section>

        <section id="bloc-eleve" class="bloc">
            <h2>Etudiant</h2>
            <img id="photo-eleve" src="photos/default.jpg" alt="Photo de l'étudiant" width="120">
            <p id="matricule-eleve"></p>
        </section>

        <section id="bloc-horaires" class="bloc">
            <h2>Horaires</h2>
            <button id="btn-debut">Début</button>
            <button id="btn-fin">Fin</button>
            <button id="btn-toilette">Toilette</button>
            <button id="btn-triche">Triche</button>
        </section>

        <section id="bloc-historique" class="bloc">
            <h2>Historique</h2>
            <table id ="tableau-historique">
                <tr>
                    <th>Matricule</th>
                    <th>Heure Debut</th>
                    <th>Heure Fin</th>
                    <th>Toilette</th>
                    <th>Triche</th>
                </tr>
            </table>

            <button id="btn-export">Exporter en CSV</button>
        </section>

    </main>

    <footer>
        <p>Projet QR Code Examen - 5GESIR</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
