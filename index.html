<!DOCTYPE html>
<html lang="fr">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Examen - Gestion de présence</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
        <h1>Gestion de présence - Examen</h1>
    </header>

    <main>

        <section id="bloc-matricule" class="bloc">
            <h2>Matricule</h2>
        </section>

        <section id="bloc-statut" class="bloc">
            <h2>Statut</h2>
        </section>

        <section id="bloc-horaires" class="bloc">
            <h2>Horaires</h2>
            <button id="btn-debut">Début</button>
            <button id="btn-fin">Fin</button>
            <button id="btn-toilette">Toilette</button>
            <button id="btn-triche">Triche</button>
        </section>

        <section id="bloc-historique" class="bloc">
            <h2>Historique</h2>
            <table id ="tableau-historique">
                <tr>
                    <th>Matricule</th>
                    <th>Heure Debut</th>
                    <th>Heure Fin</th>
                    <th>Toilette</th>
                    <th>Triche</th>
                </tr>
            </table>
        </section>

    </main>

    <footer>
        <p>Projet QR Code Examen - 5GESIR</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
